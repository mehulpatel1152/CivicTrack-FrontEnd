<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review completion · CivicTrack</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>

<div id="navbar-mount"></div>

<div class="review-shell" id="reviewRoot">

  <div class="detail-header" id="reviewHeader"></div>

  <div class="section-block">
    <h3>Location</h3>
    <div id="reviewMap" style="height:220px;"></div>
  </div>

  <div class="section-block">
    <h3>Before / after photos</h3>
    <div id="reviewMedia"></div>
  </div>

  <div class="section-block">
    <h3>Tracking</h3>
    <div class="timeline" id="timeline"></div>
  </div>

</div>

<div class="action-bar">
  <input type="text" id="sendBackReason" placeholder="Reason to send back (required)" />
  <button class="btn-reject" id="sendBackBtn">Send back</button>
  <button class="btn-verify" id="approveBtn">Approve</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/complaints.js"></script>
<script src="../js/detail-api.js"></script>
<script>renderNavbar("");</script>
<script src="../js/authority-review.js"></script>
</body>
</html>
